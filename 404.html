<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>404 - Halaman Tidak Ditemukan</title>

<link rel="icon" href="https://nbmindonesia.github.io/favicon.ico">

<meta name="robots" content="noindex">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#f5f5f5;
color:#222;
text-align:center;
padding:20px;

}

.container{

max-width:500px;

}

h1{

font-size:90px;
margin-bottom:10px;

}

h2{

font-size:28px;
margin-bottom:15px;

}

p{

font-size:17px;
line-height:1.6;
color:#666;
margin-bottom:25px;

}

.loader{

width:42px;
height:42px;
border:4px solid #ddd;
border-top:4px solid #111;
border-radius:50%;
margin:auto;
animation:spin .8s linear infinite;

}

@keyframes spin{

to{

transform:rotate(360deg);

}

}

</style>

<script>

setTimeout(()=>{

window.location.replace("https://nbmindonesia.github.io/");

},3000);

</script>

</head>

<body>

<div class="container">

<h1>404</h1>

<h2>Halaman Tidak Ditemukan</h2>

<p>
Maaf, halaman yang Anda cari tidak tersedia atau telah dipindahkan.
Anda akan diarahkan ke halaman utama dalam <strong>3 detik</strong>.
</p>

<div class="loader"></div>

</div>

</body>
</html>
